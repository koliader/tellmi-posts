syntax = "proto3";

package pb;

option go_package = "github.com/koliader/tellmi-posts";

message User {
  int64 id = 1;
  string username = 2;
  string role = 3;
  bool isBlocked = 4;
}

message Post {
  int64 id = 1;
  string title = 2;
  string description = 3;
  string author = 4;
}

message Empty {}

message Success {
  string message = 1;
}

